<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Backpack body -->
  <rect x="12" y="22" width="40" height="34" rx="8" fill="#E53935"/>
  <!-- Backpack top flap -->
  <rect x="12" y="16" width="40" height="14" rx="8" fill="#EF5350"/>
  <!-- Shoulder strap -->
  <path d="M22 12 Q18 10 16 16" stroke="#B71C1C" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M42 12 Q46 10 48 16" stroke="#B71C1C" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Handle -->
  <path d="M26 12 Q32 8 38 12" stroke="#B71C1C" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- Front pocket -->
  <rect x="20" y="38" width="24" height="14" rx="5" fill="#C62828"/>
  <!-- Zipper line -->
  <line x1="20" y1="38" x2="44" y2="38" stroke="#FFCDD2" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Pocket zipper tab -->
  <circle cx="32" cy="38" r="2.5" fill="#EF9A9A"/>
  <!-- Shine -->
  <path d="M16 22 Q18 18 24 18" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>
